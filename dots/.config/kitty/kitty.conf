# Theming (colors from quickshell when present)
include ~/.local/state/quickshell/user/generated/terminal/kitty-theme.conf

# Font
font_family      JetBrains Mono Nerd Font
font_size        11.5
bold_font        auto
italic_font      auto
bold_italic_font auto
adjust_line_height 105%
adjust_column_width 0

# Cursor
cursor_shape beam
cursor_trail 1
cursor_blink_interval -1

# Modern look: transparency (tweak opacity to taste)
# Note: background_blur often forces an OPAQUE window on Wayland/Hyprland — transparency stops working.
# Keep blur at 0 for see-through; raise only if your compositor keeps transparency (try 8–24).
background_blur               0
dynamic_background_opacity    yes
map kitty_mod+equal           change_font_size all +1.0
map kitty_mod+minus           change_font_size all -1.0
map kitty_mod+0               change_font_size all 0
map kitty_mod+kp_add          change_font_size all +1.0
map kitty_mod+kp_subtract     change_font_size all -1.0
map kitty_mod+kp_0            change_font_size all 0
map ctrl+shift+0              set_background_opacity default
# Tight window chrome
window_padding_width          2 2
window_margin_width           0
single_window_margin_width    0
# Hyprland / tiling: no client-side titlebar (compositor draws the frame)
hide_window_decorations       yes
window_border_width           0
draw_minimal_borders          yes

# No stupid close confirmation
confirm_os_window_close 0

# Use fish shell
shell fish

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0

# Opacity last so a generated theme (include above) cannot override it
background_opacity            0.85
